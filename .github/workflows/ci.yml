# Pull-request gates for develop and main.
# hugo fails on build errors and on warnings (--panicOnWarning).
# lychee fails the job on broken internal links. External failures are warnings.
# gitleaks scans only the commits on the pull request.

name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  HUGO_VERSION: "0.145.0"
  LYCHEE_VERSION: "0.24.2"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Hugo extended
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 755 /tmp/hugo /usr/local/bin/hugo
          hugo version | grep -F "${HUGO_VERSION}"

      - name: Build
        run: hugo --gc --minify --panicOnWarning --baseURL /

  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Hugo extended
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 755 /tmp/hugo /usr/local/bin/hugo
          hugo version | grep -F "${HUGO_VERSION}"

      - name: Build
        run: hugo --gc --minify --panicOnWarning --baseURL /

      - name: Install lychee
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp
          sudo install -m 755 /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version | grep -F "${LYCHEE_VERSION}"

      - name: Check internal links
        run: lychee --offline --root-dir public public

      - name: Check external links
        continue-on-error: true
        run: |
          set +e
          lychee --exclude https://www.linkedin.com/in/jorge-daniel-laborda-sicilia --root-dir public public --format json --output /tmp/lychee-external.json
          status=$?
          set -euo pipefail
          cat /tmp/lychee-external.json
          jq -r '[((.error_map // {})[][]?.url), ((.timeout_map // {})[][]?.url)] | map(select(. != null)) | unique | .[]' /tmp/lychee-external.json | while IFS= read -r url; do
            printf '::warning::%s\n' "$url"
          done
          exit "$status"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version | grep -F "${GITLEAKS_VERSION}"

      - name: Scan pull request commits
        run: gitleaks detect --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
